# Coverage is a signal, not a gate. Every status is informational, so a drop
# annotates the pull request without blocking merge — Renovate's update PRs
# have to stay mergeable on checks alone.
#
# Two flags because the suites measure different languages through different
# tools: `python` from pytest-cov, `bats` from kcov. One combined number would
# move for reasons neither suite owns.
#
# Leading dot keeps chezmoi from deploying this as a dotfile, the same reason
# .ruff.toml carries one.

coverage:
  status:
    # `auto` compares each flag against its own base commit, so the floor
    # tracks the codebase instead of a hand-picked number that rots.
    project:
      default:
        informational: true
      python:
        informational: true
        flags:
          - python
      bats:
        informational: true
        flags:
          - bats
    patch:
      default:
        informational: true
