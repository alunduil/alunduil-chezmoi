# Items script/unmanaged-inventory reports that a rebuild deliberately leaves
# behind. kind is package or unit; each pattern is a glob matched against the
# item as the script prints it.

[[dropped]]
kind = "package"
reason = "Headless-browser dependency; Playwright's install-deps reinstalls it."
patterns = [
  "fonts-ipafont-gothic",
  "fonts-noto-color-emoji",
  "fonts-tlwg-loma-otf",
  "fonts-unifont",
  "fonts-wqy-zenhei",
  "xfonts-scalable",
  "xvfb",
]

[[dropped]]
kind = "package"
reason = "Library from an earlier Debian release."
patterns = [
  "libffi7",
  "libssl1.1",
  "libsepol1",
]

[[dropped]]
kind = "package"
reason = "One-off install for a task that is done."
patterns = [
  "btrfs-progs",
  "gstreamer1.0-*",
  "libgstreamer*",
  "freeglut3-dev",
  "libglu1-mesa-dev",
  "cifs-utils",
  "ipmitool",
  "influxdb-client",
  "libssl-dev",
  "rclone",
  "whiptail",
]

[[dropped]]
kind = "package"
reason = "uv manages Python environments instead."
patterns = [
  "python3-pip",
  "python3.11-venv",
]

[[dropped]]
kind = "package"
reason = "beets tags the music library instead."
patterns = ["picard"]

[[dropped]]
kind = "package"
reason = "App unused since 2026-04."
patterns = ["zotero"]

[[dropped]]
kind = "package"
reason = "Docker is the declared container runtime."
patterns = ["podman"]

[[dropped]]
kind = "package"
reason = "Portal for sandboxed apps, and nothing here runs sandboxed."
patterns = ["xdg-desktop-portal-gtk"]

[[dropped]]
kind = "unit"
reason = "Ships with podman, which is dropped."
patterns = ["podman*"]

[[dropped]]
kind = "unit"
reason = "Ships with xdg-desktop-portal-gtk, which is dropped."
patterns = ["xdg-desktop-portal-rewrite-launchers.service"]
