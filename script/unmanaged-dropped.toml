# Items script/unmanaged-inventory reports that a rebuild deliberately leaves
# behind. kind is file, package, or unit; each pattern is a glob matched
# against the item as the script prints it, where * also matches /.

[[dropped]]
kind = "file"
reason = "Cache; tools refill it on demand."
patterns = [".cache"]

[[dropped]]
kind = "file"
reason = "Runtime state, by the XDG base directory spec."
patterns = [".local/state"]

[[dropped]]
kind = "file"
reason = "Deleted files."
patterns = [".local/share/Trash"]

[[dropped]]
kind = "file"
reason = "The apply clone; the bootstrap's chezmoi init recreates it."
patterns = [".local/share/chezmoi"]

[[dropped]]
kind = "file"
reason = "Enable symlinks; the bootstrap's systemctl enable recreates them."
patterns = [".config/systemd/user/*.target.wants"]

[[dropped]]
kind = "file"
reason = "npm's download cache."
patterns = [".npm"]

[[dropped]]
kind = "file"
reason = "Per-session X credentials."
patterns = [".Xauthority"]

[[dropped]]
kind = "file"
reason = "Marker that suppresses sudo's first-use hint."
patterns = [".sudo_as_admin_successful"]

[[dropped]]
kind = "file"
reason = "Shell history."
patterns = [".bash_history"]

[[dropped]]
kind = "file"
