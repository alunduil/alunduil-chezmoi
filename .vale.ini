StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft, proselint, alex
Vocab = Project

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex
proselint.Cliches = NO
proselint.Spelling = NO
alex.ProfanityUnlikely = NO
# Flags common words such as "allows" for lookup in Microsoft's word
# list. Every hit is noise.
Microsoft.Vocab = NO

# ADRs are reconstructed months later, so cap their reading difficulty.
# Score is the mean of Flesch-Kincaid and Automated Readability (one
# syllable-based, one character-based: averaging cancels the syllable-
# estimation noise each metric introduces on technical jargon), capped
# at 12. error because vale only fails on error severity (warnings never
# gate, and the pre-commit hook prints at error).
[docs/adr/*.md]
ADR.Readability = error

# Agent-read instructions. Optimised for tokens, not readability, so the
# rules that inflate prose (sentence case, contractions, passive voice,
# 'e.g.' expansion) are absent. A new tool's instruction file belongs in
# this glob. A section's own BasedOnStyles replaces the inherited list
# rather than extending it.
[{AGENTS,CLAUDE,.claude/**/*}.md]
BasedOnStyles = Vale, alex

Microsoft.Adverbs = YES
Microsoft.Avoid = YES
Microsoft.Terms = YES
Microsoft.Wordiness = YES
