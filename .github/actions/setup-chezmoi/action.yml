name: Set up chezmoi
description: >-
  Install the pinned chezmoi and apply the named externals from this checkout.
  An externals-only apply needs no chezmoi config and no age key.
inputs:
  externals:
    description: Space-separated external targets, relative to $HOME.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install chezmoi
      shell: bash
      env:
        # renovate: datasource=github-releases depName=twpayne/chezmoi
        CHEZMOI_VERSION: "v2.73.0"
      run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin -t "$CHEZMOI_VERSION"

    # chezmoi reuses a cached download whatever its state db says, so this
    # skips the fetch on a fresh runner.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/chezmoi/external
        key: chezmoi-externals-${{ github.job }}-${{ hashFiles('.chezmoiexternal.toml') }}

    - name: Apply externals
      if: inputs.externals != ''
      shell: bash
      env:
        EXTERNALS: ${{ inputs.externals }}
      run: |
        # An externals-only apply skips directory entries, so the parents must
        # already exist.
        targets=()
        for t in $EXTERNALS; do
          mkdir -p "$(dirname "$HOME/$t")"
          targets+=("$HOME/$t")
        done
        chezmoi apply --source="$GITHUB_WORKSPACE" --include=externals "${targets[@]}"
        echo "$HOME/.local/bin" >>"$GITHUB_PATH"
