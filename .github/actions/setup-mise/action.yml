name: Set up mise tools
description: >-
  Install the named tools from the mise config chezmoi deploys, at the
  versions and checksums in its mise.lock, with their shims on PATH.
inputs:
  tools:
    description: >-
      Space-separated tool names from dot_config/mise/config.toml; empty
      installs every tool.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # The config chezmoi deploys, read in place so mise.lock and its npm
    # sidecars resolve beside it.
    - name: Point mise at the checkout's config
      shell: bash
      run: echo "MISE_GLOBAL_CONFIG_FILE=$GITHUB_WORKSPACE/dot_config/mise/config.toml" >>"$GITHUB_ENV"

    - id: mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        install_args: ${{ inputs.tools }}
        cache_key: mise-{{platform}}-{{install_args_hash}}-${{ hashFiles('dot_config/mise/mise.lock', 'dot_config/mise/.mise/**') }}

    # mise's own hint for a lockfile miss suggests `mise install`, which
    # this repo's locked config refuses.
    - name: Name the fix for a lockfile miss
      if: failure() && steps.mise.outcome == 'failure'
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        read -ra tools <<<"$TOOLS"
        output="$(mise install --locked "${tools[@]}" 2>&1)" || true
        if grep -q 'is not in the lockfile' <<<"$output"; then
          echo '::error file=dot_config/mise/mise.lock::A pinned version is missing from mise.lock. Run `just lock-tools` and commit dot_config/mise/mise.lock.'
        fi
