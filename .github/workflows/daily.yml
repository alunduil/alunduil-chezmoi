name: Daily

# Offset from the hour deliberately: schedules landing on the hour queue
# behind the platform's peak load.
on:
  schedule:
    - cron: '47 6 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # No cancel-in-progress here, unlike the other scheduled workflow: a
  # truncated sweep loses the stale action's operations-per-run resume cache
  # and restarts from the first pull request on the next run.
  group: ${{ github.workflow }}

jobs:
  stale-pull-requests:
    name: Prune stale pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The action's README also asks for `actions: write`, which covers only
      # its resume cache. Without that scope a truncated run warns and restarts
      # rather than failing.
      issues: write
      pull-requests: write
    steps:
      # Issues are out of scope. Excluding them from marking alone would still
      # leave any already carrying the label eligible for closing on the next
      # run, so both legs are disabled.
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 14
          # Closing a Renovate pull request tells Renovate the update is
          # unwanted and it will not offer that version again, and #406 already
          # tracks update types that park indefinitely without merging. So this
          # is a correctness exemption rather than a courtesy one, and it only
          # works because renovate.json applies the label.
          exempt-pr-labels: dependencies
          stale-pr-message: >-
            This has been quiet for 30 days, so it's picked up a stale label. A
            comment or a push clears the label and restarts the clock. Otherwise
            this closes in another 14 days.
          close-pr-message: >-
            Closing this after 44 quiet days. That isn't a call on the change
            itself, and nothing is lost: the branch stays where it is, so
            comment here if you want to pick it back up and I'll reopen it.
