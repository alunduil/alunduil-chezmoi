name: Bootstrap

# Upstream apt repositories and releases change without a pull request here,
# hence the weekly run alongside the path gate.
on:
  push:
    branches: [main]
    paths: &paths
      - '.chezmoiscripts/**'
      - '.chezmoidata/**'
      - '.chezmoitemplates/**'
      - '.chezmoi.toml.tmpl'
      - '.chezmoiignore'
      - 'dot_bash_profile'
      - 'dot_profile'
      - 'dot_config/mise/**'
      - 'etc/**'
      - 'script/lib/bootstrap.sh'
      - 'docs/tutorials/bootstrap.md'
      - 'script/checks/fresh-host'
      - 'script/checks/fresh-host.Dockerfile'
      - '.github/workflows/bootstrap.yml'
  pull_request:
    paths: *paths
  schedule:
    - cron: '0 7 * * 1'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel main so each commit completes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fresh-host:
    name: Bootstrap a fresh Debian host
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap, reapply, and check nothing changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: script/checks/fresh-host
