name: CI

# Sensors that run on every integration event. Path-gated checks have a
# narrower "when" and keep their own files;
# docs/adr/0004-consolidate-ci-workflow.md carries the naming rule.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel main so each commit completes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hooks:
    name: Run pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The local lychee hook runs lychee from PATH; provision it here.
      - uses: ./.github/actions/setup-mise
        with:
          tools: prek github:lycheeverse/lychee
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run hooks
        run: prek run --all-files --show-diff-on-failure --color=always

  shell-tests:
    name: Test shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # codecov-action authenticates by OIDC, so there is no upload token to
      # store or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Bats itself only: the helper libraries come from mise below, the same
      # pin the host loads.
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
          # bats-action curls api.github.com; auth raises the anonymous rate limit.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-mise
        with:
          tools: npm:bats-support npm:bats-assert

      - uses: ./.github/actions/setup-kcov

      # kcov only traces scripts run from the checkout, so tests that copy their
      # subject to a temp path first (gh_wrapper, pr_draft_guard) report as
      # uncovered despite being tested.
      - name: Test
        run: |
          BATS_LIB_PATH="$(mise where npm:bats-support)/node_modules:$(mise where npm:bats-assert)/node_modules" \
            kcov --include-path=dot_local,dot_claude,script \
            --exclude-pattern=.bats,/fixtures/ \
            coverage bats --recursive dot_local dot_claude script

      # kcov writes to coverage/bats.<hash>/ and symlinks coverage/bats beside
      # it; the symlink is the only stable path.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/bats/cobertura.xml
          disable_search: true
          flags: bats

  chezmoi-source:
    name: Validate chezmoi source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-mise
        with:
          tools: chezmoi

      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Generate ephemeral age key
        run: |
          mkdir -p ~/.config/chezmoi
          age-keygen -o ~/.config/chezmoi/key.txt

      - name: Check apply
        run: script/checks/chezmoi-apply

      - name: Check script templates render
        run: script/checks/chezmoi-template

      - name: Check settings permission grammar
        run: script/checks/settings-permissions

  zellij-config:
    name: Validate zellij config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-mise
        with:
          tools: zellij

      - name: Check config
        run: script/checks/zellij-config

  # Alloy validates its own config, hence the install. Deliberately ungated so
  # a broken config fails the build whatever changed.
  telemetry-config:
    name: Validate telemetry config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-mise
        with:
          tools: github:grafana/alloy

      - name: Validate config
        run: script/checks/telemetry-config

  pinned-tools:
    name: Run pinned tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-mise

      - name: Check versions
        run: script/checks/pinned-tools

  # vale exits non-zero only on errors, so reviewdog gates instead and fails on
  # any finding a PR adds: suggestions carry most of the prose signal. The
  # pre-commit hook covers errors tree-wide, including pushes to main, where
  # this job has no PR to diff against.
  # .vale/styles/ is vendored, so no `vale sync` step.
  prose:
    name: Check prose
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-mise
        with:
          tools: vale

      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0

      - name: Run vale gate
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Named paths rather than `vale .`, which walks into the vendored
          # styles under .vale/styles/ and dies on frontmatter it can't parse
          # in dot_claude/. CLAUDE.md is the one root doc that stays out.
          vale --output=JSON --glob='!CLAUDE.md' ./*.md docs/ > vale.json || true
          # A vale crash yields no JSON; fail here rather than report nothing.
          jq -e . vale.json > /dev/null
          jq -c '
            to_entries[] | .key as $p | .value[] | {
              message: .Message,
              location: {
                path: $p,
                range: {
                  start: {line: .Line, column: .Span[0]},
                  end: {line: .Line, column: (.Span[1] + 1)},
                },
              },
              severity: ({error: "ERROR", warning: "WARNING", suggestion: "INFO"}[.Severity]),
              code: {value: .Check},
            }' vale.json \
            | reviewdog -f=rdjsonl -name=vale \
                -reporter=github-pr-check -filter-mode=added -fail-level=any
