name: Systemd

# Verifies the systemd user units with `systemd-analyze verify`. verify
# resolves each unit's ExecStart against the calling user's %h, so it installs
# every binary the units reference first.
on:
  push:
    branches: [main]
    paths: &paths
      - 'dot_config/systemd/user/**'
      - 'etc/systemd/system/**'
      - 'dot_local/bin/executable_cgroup-pids-textfile'
      - 'dot_local/bin/executable_git-poi-all'
      - 'dot_local/bin/executable_git-worktree-poi'
      - 'dot_local/bin/executable_dev-cache-gc'
      - '.chezmoiexternal.toml'
      - '.github/actions/setup-chezmoi/**'
      - 'script/checks/systemd-units'
      - '.github/workflows/systemd.yml'
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel main so each commit completes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-chezmoi
        with:
          externals: .local/bin/alloy

      - name: Install referenced scripts
        run: |
          for s in cgroup-pids-textfile git-poi-all git-worktree-poi dev-cache-gc; do
            install -m 0755 "dot_local/bin/executable_$s" "$HOME/.local/bin/$s"
          done

      - name: Install the 1Password desktop app
        run: |
          curl -fsSL https://downloads.1password.com/linux/keys/1password.asc |
            sudo gpg --dearmor -o /usr/share/keyrings/1password-archive-keyring.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main' |
            sudo tee /etc/apt/sources.list.d/1password.list
          sudo apt-get update
          sudo apt-get install -y 1password

      - name: Verify systemd units
        run: script/checks/systemd-units
