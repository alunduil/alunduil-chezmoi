# .vale/styles/ is vendored by `vale sync`; only config/ (our Project vocab)
# is ours. Keep the vendored packages out of every hook.
exclude: ^\.vale/styles/(?!config/)

repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['-x']
        files: (executable_|\.sh(\.tmpl)?$)
        # Python behind a `uv run --script` shebang, which identify can't type.
        exclude: ^dot_local/bin/executable_truenas-api$
        types: [text]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: ['-i', '2', '-ci']
        files: (executable_|\.sh(\.tmpl)?$)
        exclude: ^dot_local/bin/executable_truenas-api$
        types: [text]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-json
        # malformed.json is intentionally invalid — a fixture for the
        # pr-draft-guard hook's fail-closed-on-bad-input test.
        exclude: ^dot_claude/hooks/fixtures/pr_draft_guard/malformed\.json$
      - id: check-yaml
        # .tmpl files are Go templates, not valid YAML until chezmoi renders.
        exclude: \.tmpl$
      - id: check-toml
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/errata-ai/vale
    rev: v3.25.1
    hooks:
      - id: vale
        args: [--output=line, --minAlertLevel=error]
        exclude: ^(CLAUDE\.md|dot_claude/|\.claude/|\.vale/styles/)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  # lychee from PATH (a mise tool) rather than an upstream hook: one version
  # pin, and the hook's precompiled binary needs a newer glibc than the host
  # has. --offline gates on internal/relative links only — fast and
  # deterministic. External URLs rot from time and third parties, not the
  # diff, so weekly.yml checks them out-of-band (#359).
  - repo: local
    hooks:
      - id: renovate-pins
        name: renovate-pins
        entry: script/checks/renovate-pins
        language: system
        pass_filenames: false
        files: ^(script/install/|\.chezmoiscripts/.*\.tmpl$|\.github/(workflows|actions)/)

      - id: bootstrap-convergence
        name: bootstrap-convergence
        entry: script/checks/bootstrap-convergence
        language: system
        pass_filenames: false
        files: ^\.chezmoiscripts/

      - id: lychee
        name: lychee
        entry: lychee --config lychee.toml --no-progress --offline --include-fragments=full
        language: system
        files: \.(md|kdl)$

      # `mise lock --dry-run` exits 0 even when the lockfile is stale.
      - id: mise-lock
        name: mise-lock
        entry: >-
          bash -c 'export MISE_GLOBAL_CONFIG_FILE="$PWD/dot_config/mise/config.toml";
          [ "$(mise lock --global --dry-run --json)" = "[]" ] ||
          { echo "mise.lock is out of date with config.toml. Run just lock-tools and commit dot_config/mise/." >&2; exit 1; }'
        language: system
        pass_filenames: false
        files: ^dot_config/mise/

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.190.0
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]
