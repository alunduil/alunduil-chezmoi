#  Replaces Debian's /usr/lib/tmpfiles.d/tmp.conf, which empties /tmp only at
#  boot and leaves /var/tmp unaged. A Crostini container rarely reboots and
#  keeps /tmp on disk, so without an age /tmp grows forever. D keeps the boot
#  wipe; the ages are systemd's upstream defaults, applied daily by the system
#  systemd-tmpfiles-clean.timer.
#Type Path     Mode User Group Age Argument
D     /tmp     1777 root root  10d
q     /var/tmp 1777 root root  30d
