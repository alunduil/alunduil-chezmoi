#  Overrides Debian's /usr/lib/tmpfiles.d/tmp.conf, which ages neither /tmp
#  nor /var/tmp. A Crostini container rarely reboots, so the boot wipe alone
#  lets /tmp grow without bound. D keeps that wipe.
#Type Path     Mode User Group Age Argument
D     /tmp     1777 root root  10d
q     /var/tmp 1777 root root  30d
