[settings]
auto_install = false
locked = true
lockfile_platforms = ["linux-x64"]
not_found_auto_install = false

[tools]
act = "0.2.98"
ansible-core = "2.22.0"
"github:grafana/alloy" = "v1.22.0"
# The extras install the libraries that the chroma and lastgenre plugins in
# dot_config/beets/config.yaml.tmpl import. chroma also needs fpcalc from apt.
"pypi:beets" = { version = "2.14.1", extras = "chroma,lastgenre" }
"github:tfausak/cabal-gild" = "1.8.4.2"
"cargo:cargo-cache" = "0.8.3"
chezmoi = "2.74.2"
"github:fourmolu/fourmolu" = "0.21.0.0"
"github:grafana/gcx" = "v1.8.0"
# The release asset is a bare binary named linux-amd64, not gh-poi.
"github:seachicken/gh-poi" = { version = "v0.18.7", bin = "gh-poi" }
# install-haskell-ecosystem installs GHC, cabal, and stack through it.
ghcup = "0.2.6.2"
hlint = "3.10"
just = "1.59.0"
lazygit = "0.66.3"
"github:jdx/mise" = "v2026.11.14"
# The glibc build needs a newer glibc than Debian bookworm ships.
"github:lycheeverse/lychee" = { version = "0.24.2", version_prefix = "lychee-v", matching = "musl" }
node = "26.13.1"
"npm:@devcontainers/cli" = "0.91.0"
"npm:@readwise/cli" = "0.5.11"
"npm:@uptimerobot/cli" = "1.3.0"
"npm:bats-assert" = "2.2.4"
"npm:bats-support" = "0.3.0"
"npm:bobbit" = "0.15.1"
# Shells out to tesseract, ghostscript, unpaper, and pngquant from apt.
"pypi:ocrmypdf" = "17.14.2"
ormolu = "0.9.0.0"
pnpm = "12.23.0"
prek = "0.5.11"
python = "3.14.10"
release-plz = "0.3.174"
rust = "1.100.0"
trivy = "0.76.2"
"github:truenas/truenas-mcp" = "v1.0.1"
uv = "0.13.10"
vale = "3.28.1"
yq = "4.54.3"
zellij = "0.46.1"
