[settings]
locked = true
lockfile_platforms = ["linux-x64"]

[tools]
act = "0.2.89"
"github:grafana/alloy" = "1.21.1"
chezmoi = "2.73.3"
"github:grafana/gcx" = "1.3.1"
just = "1.59.0"
lazygit = "0.66.0"
# The glibc build needs a newer glibc than Debian bookworm ships.
"github:lycheeverse/lychee" = { version = "0.24.2", version_prefix = "lychee-v", matching = "musl" }
"npm:bats-assert" = "2.2.4"
"npm:bats-support" = "0.3.0"
trivy = "0.76.1"
"github:truenas/truenas-mcp" = "0.0.6"
uv = "0.13.4"
vale = "3.24.0"
yq = "4.54.1"
zellij = "0.45.1"
