#  Age stale downloads out of ~/Downloads (%h = $HOME). Downloads include
#  short-lived secrets (private keys, exports), so the window is short: a file
#  worth keeping gets moved out within a week. Same all-three-timestamps rule
#  as cache.conf, so anything opened or touched resets the clock.
#Type Path         Mode User Group Age Argument
e     %h/Downloads -    -    -     7d
