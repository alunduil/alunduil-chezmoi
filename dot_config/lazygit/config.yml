# Colors name ANSI slots, never hex, so lazygit draws from the terminal's
# Tempus Night palette (see kitty.conf) and inherits its 7:1 guarantee.
# Every override below replaces a default that pairs two coloured slots or
# computes its own RGB.

gui:
  theme:
    # Swapping foreground and background keeps each cell's contrast ratio.
    selectedLineBgColor:
      - reverse
    inactiveViewSelectedLineBgColor:
      - underline
    # black is slot 0, the terminal background, so black on a slot has the
    # same contrast as that slot on the background.
    cherryPickedCommitFgColor:
      - black
    cherryPickedCommitBgColor:
      - cyan
    markedBaseCommitFgColor:
      - black
    markedBaseCommitBgColor:
      - yellow
    authorColors:
      "*": cyan
