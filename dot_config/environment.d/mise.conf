# mise has no global-only mode, so switch off each way it finds project
# config: config filenames, .tool-versions, environments, and auto_env.
# Host shims then read only ~/.config/mise/config.toml. A checkout's
# .miserc.toml overrides the global miserc.toml, so these stay
# environment variables. ~/.profile sources this file: keep it to plain
# KEY=VALUE lines.
MISE_OVERRIDE_CONFIG_FILENAMES=none
MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES=none
# environment.d rejects an empty value, and mise drops the empty
# entries a lone comma splits into, leaving no environment selected.
MISE_ENV=,
MISE_AUTO_ENV=false
