# Written by foot-theme-auto. Edits are overwritten on the next
# daylight transition; change the schedule, not this file.
#
# chezmoi's create_ attribute deploys this once and never touches it again,
# which is what keeps the timer's writes from reading as drift on every
# apply. foot.ini includes it unconditionally, so it has to exist before the
# first foot window opens -- an absent include is a config error, not a
# skipped line.
#
# foot 1.25 numbers its color sections: 1 is [colors] (dark), 2 is [colors2]
# (light). 1.26 renamed them to dark/light but needs a newer libxkbcommon
# than bookworm ships -- see script/install/foot.
[main]
initial-color-theme=1
