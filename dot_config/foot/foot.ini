# foot, built from source by script/install/foot.

[main]
# A replacement font must also cover U+E0B0, which zellij-rate-limit-status
# draws. fontconfig substitutes a Unifont bitmap rather than failing, so a
# font that lacks it degrades silently. docs/how-to/foot-terminal.md has the
# query.
font=JetBrains Mono:size=11

# Sommelier reports a scaling factor of 1 and scales the surface itself, so
# sizing fonts from the panel's 153 DPI renders them around 1.6x the
# requested point size.
dpi-aware=no

# Selenized carries a dark and a light variant with contrast matched between
# them. Sixteen distinct ANSI slots are load-bearing: .vimrc sets no
# colorscheme, so vim reads its syntax colors straight off them.
include=~/.local/share/foot/themes/selenized

# Written by foot-theme-auto, which sets initial-color-theme so a window
# opened in daylight starts light. Running windows take a signal instead.
include=~/.config/foot/theme-state.ini

[scrollback]
# The backstop for panes zellij is not managing; it keeps its own per pane.
lines=10000
