# foot, installed from apt.

[main]
# A replacement font must also cover U+E0B0, which zellij-rate-limit-status
# draws. fontconfig substitutes a Unifont bitmap rather than failing, so a
# font that lacks it produces no error. docs/how-to/foot-terminal.md has the
# query.
font=JetBrains Mono:size=11

# Sommelier reports a scaling factor of 1 and scales the surface itself, so
# sizing fonts from the panel's 153 DPI renders them around 1.6x the
# requested point size.
dpi-aware=no

[scrollback]
# The backstop for panes zellij is not managing; it keeps its own per pane.
lines=10000

# Tempus Night, by Protesilaos Stavrou, inlined because the Debian package
# ships no themes directory. Picked by measurement over the 84 themes foot
# publishes: every one of the sixteen slots clears WCAG AAA (7:1) against the
# background at 8.1:1, foreground reaches 13.2:1, and the background is
# exactly neutral -- zero saturation, so it casts neither warm nor cool. That
# combination reads in daylight without being harsh at night, which is what a
# single fixed theme has to do here.
#
# All sixteen are distinct. .vimrc sets no colorscheme, so vim takes its
# syntax colors straight off these slots, and a theme collapsing bright onto
# regular would flatten them.
[colors]
foreground=e0e0e0
background=1a1a1a

regular0=1a1a1a
regular1=ff929f
regular2=5fc940
regular3=c5b300
regular4=5fb8ff
regular5=ef91df
regular6=1dc5c3
regular7=c4bdaf

bright0=242536
bright1=f69d6a
bright2=88c400
bright3=d7ae00
bright4=8cb4f0
bright5=de99f0
bright6=00ca9a
bright7=e0e0e0
