# foot, installed from apt.

[main]
# ~/.profile puts ~/.local/bin on PATH, and ~/.bash_profile starts ssh-agent;
# bash reads both only for a login shell. Non-login, zellij and chezmoi do not
# resolve and there is no agent.
login-shell=yes

# A replacement font must cover U+E0B0, which zellij-rate-limit-status draws.
# Lacking it produces no error: fontconfig substitutes a Unifont bitmap, and
# the separator renders as a blob. Check with:
#   fc-list ':charset=e0b0' family
font=JetBrains Mono:size=11

# Sommelier reports a scaling factor of 1 and scales the surface itself. The
# default, auto, sizes fonts by DPI whenever every monitor reports 1, which
# on this 153 DPI panel renders them around 1.6x the requested point size.
dpi-aware=no

# center distributes the sub-cell slack across both edges rather than pooling
# it on the right and bottom.
pad=4x4 center

# Sommelier bridges CLIPBOARD to ChromeOS. both puts mouse selections there as
# well as in PRIMARY, so they reach ChromeOS apps.
selection-target=both

[scrollback]
# The backstop for panes zellij is not managing; zellij keeps its own.
lines=10000

[mouse]
hide-when-typing=yes

# Tempus Night, by Protesilaos Stavrou, inlined because the Debian package
# ships no themes directory. A replacement needs all three of:
#   - every slot at WCAG AAA, 7:1 against the background, which is what lets
#     one theme stay readable in daylight and at night;
#   - a background close to neutral;
#   - sixteen distinct slots, because .vimrc sets no colorscheme and vim reads
#     its syntax colors straight off them. Catppuccin repeats its bright row;
#     Solarized reassigns half the slots to base tones.
[colors]
foreground=e0e0e0
background=1a1a1a

regular0=1a1a1a
regular1=ff929f
regular2=5fc940
regular3=c5b300
regular4=5fb8ff
regular5=ef91df
regular6=1dc5c3
regular7=c4bdaf

bright0=242536
bright1=f69d6a
bright2=88c400
bright3=d7ae00
bright4=8cb4f0
bright5=de99f0
bright6=00ca9a
bright7=e0e0e0
