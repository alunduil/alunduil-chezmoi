# foot, built from source by script/install/foot. Bookworm ships 1.13.1,
# which predates every theme-switching feature this config depends on.

[main]
# JetBrains Mono covers U+E0B0, the Powerline separator
# zellij-rate-limit-status draws. No font in the base container image does, and
# fontconfig would otherwise fall through to Unifont CSUR and render it as a
# mismatched bitmap blob -- so a replacement font has to be checked for that
# codepoint, not just for looks. docs/how-to/foot-terminal.md has the query.
font=JetBrains Mono:size=11

# Sommelier reports a scaling factor of 1 and scales the surface itself, so
# leaving foot to size fonts from the panel's 153 DPI would render everything
# around 1.6x the requested point size.
dpi-aware=no

# Selenized ships with foot and carries both themes in one file -- [colors]
# dark, [colors2] light -- with contrast matched between them. That matters
# here because the window follows the sun rather than settling on one variant,
# so neither can be the compromise. Solarized would not do: it reassigns eight
# of the sixteen ANSI slots to base tones, and .vimrc sets no colorscheme, so
# vim reads its syntax colors straight off those slots.
include=~/.local/share/foot/themes/selenized

# initial-color-theme, written by foot-theme-auto so a window opened in
# daylight starts light instead of starting dark and flipping on the next
# timer tick. Running windows switch by SIGUSR1/SIGUSR2 instead, which no
# config file can express -- hence the split. chezmoi creates this file once
# (create_theme-state.ini) and then leaves it to the timer.
include=~/.config/foot/theme-state.ini

[scrollback]
# zellij keeps its own scrollback per pane, so foot's is the backstop for the
# panes zellij is not managing.
lines=10000
