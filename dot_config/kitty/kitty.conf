# kitty, installed from apt.

# A replacement font must cover U+E0B0, which zellij-rate-limit-status draws.
# Lacking it produces no error: fontconfig substitutes a Unifont bitmap, and
# the separator renders as a blob. Check with:
#   fc-list ':charset=e0b0' family
font_family      JetBrains Mono
font_size        11

# `shell .` runs the user's shell without --login, so bash reads ~/.bashrc and
# never ~/.profile -- which is where ~/.local/bin joins PATH -- nor
# ~/.bash_profile, which starts ssh-agent.
shell bash --login

# Sommelier bridges CLIPBOARD to ChromeOS, so selections reach ChromeOS apps
# only when they land there rather than in the primary selection.
copy_on_select clipboard

# The backstop for panes zellij is not managing; zellij keeps its own.
scrollback_lines 10000

window_padding_width 4

# Hide the pointer on keypress rather than after an idle timeout.
mouse_hide_wait -1

# zellij always holds the mouse grab, so opening a link needs a binding kitty
# claims before forwarding. kitty's own grabbed-mode binding is shift+left,
# which does not work here: shift+left press already starts a selection, and
# mouse_handle_click skips the link when a selection exists. It is also a
# `click`, so it waits out click_interval to rule out a double click. ctrl+left
# is unbound in the defaults and takes the release-based path -- no delay, and
# nothing competing for the press. The default ctrl+shift+left stays available.
# Cost: no pane inside zellij can see a ctrl-modified left click.
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+left press grabbed discard_event

# Keyboard equivalent, and the only affordance the pair bar's repaints cannot
# blink away: ctrl+shift+p then y labels every hyperlink on screen. 0.26.5 has
# no underline_hyperlinks, so the hover underline is recomputed on mouse motion
# alone and zellij's repaints keep clearing it.

# Tempus Night, by Protesilaos Stavrou. A replacement needs all three of:
#   - every slot at WCAG AAA, 7:1 against the background, which is what lets
#     one theme stay readable in daylight and at night;
#   - a background close to neutral;
#   - sixteen distinct slots, because .vimrc sets no colorscheme and vim reads
#     its syntax colors straight off them. Catppuccin repeats its bright row;
#     Solarized reassigns half the slots to base tones.
foreground #e0e0e0
background #1a1a1a

color0  #1a1a1a
color1  #ff929f
color2  #5fc940
color3  #c5b300
color4  #5fb8ff
color5  #ef91df
color6  #1dc5c3
color7  #c4bdaf

color8  #242536
color9  #f69d6a
color10 #88c400
color11 #d7ae00
color12 #8cb4f0
color13 #de99f0
color14 #00ca9a
color15 #e0e0e0
