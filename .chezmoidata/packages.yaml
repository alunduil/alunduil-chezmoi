packages:
  apt:
    - gh
    - zsh
    - ripgrep
    - fd-find
    - fzf
    - jq
    - unzip
    - age
    - terraform
    - libnotify-bin
    - 1password-cli
    - build-essential
    - libffi-dev
    - libgmp-dev
    - libncurses-dev
    - zlib1g-dev
    - protobuf-compiler
    - temurin-21-jdk
    - golang-petname
    # Music-library toolchain around beets, which uv installs separately.
    # Package names differ from the binaries they ship: ffmpeg -> ffprobe,
    # libimage-exiftool-perl -> exiftool, libchromaprint-tools -> fpcalc,
    # which is the fingerprinter pyacoustid shells out to.
    - ffmpeg
    - mediainfo
    - libimage-exiftool-perl
    - rsync
    - libchromaprint-tools
    - keybase
    - signal-desktop
    - calibre
    - nethack-console
    - docker-ce
    - docker-ce-cli
    - docker-ce-rootless-extras
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    # Automatic security updates, configured by enable-unattended-upgrades.
    # powermgmt-base provides on_ac_power, which the OnlyOnACPower gate in
    # 50unattended-upgrades needs to read the AC line; without it
    # unattended-upgrades fails open.
    - unattended-upgrades
    - powermgmt-base
    - needrestart
    # foot's build dependencies (script/install/foot). bookworm's foot is
    # 1.13.1 and cannot switch color themes at runtime, so it is built from
    # source; wayland-protocols and fcft are pinned meson subprojects rather
    # than apt packages because bookworm's are older than foot accepts.
    - meson
    - ninja-build
    - scdoc
    - libwayland-dev
    - libxkbcommon-dev
    - libpixman-1-dev
    - libfontconfig-dev
    - libutf8proc-dev
    - libharfbuzz-dev
    - libpng-dev
    # foot renders from the container's fontconfig rather than the ChromeOS
    # side, which is where the terminal font used to come from. JetBrains Mono
    # also covers U+E0B0, the Powerline separator zellij-rate-limit-status
    # draws and the base image has in no font -- so no separate symbol font is
    # needed. Swapping the primary means re-checking that:
    #   fc-list ':charset=e0b0' family
    - fonts-jetbrains-mono
