# Renovate bumps every copy of a version inside a URL, so write it out in
# full wherever an asset name repeats it. Release assets carry no checksum
# (docs/adr/0008-install-pinned-binaries-as-chezmoi-externals.md). GitHub
# generates source-archive tarballs on request, so those pin a hash.

[".local/bin/act"]
    type = "archive-file"
    url = "https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz"
    path = "act"
    executable = true

